<div class="announce">
  <strong>Shipping available at cost — no markup.</strong>&nbsp; Text us anytime: 650-248-2473
</div>
<header class="site-header">
  <div class="wrap header-inner">
    <a href="/" class="brand">
      <img src="/images/logo-icon.png" alt="Premium Acrylics 415" class="brand-logo">
      Premium Acrylics 415
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>

    <nav class="main-nav" id="mainNav">
      <a href="/shop.html" data-nav="shop">Shop</a>
      <a href="/shop.html?category=pokemon" data-nav="pokemon">Pokémon</a>
      <a href="/shop.html?category=one-piece" data-nav="one-piece">One Piece</a>
      <a href="/about.html" data-nav="about">About</a>
      <a href="/faq.html" data-nav="faq">FAQ</a>
      <a href="/contact.html" data-nav="contact">Contact</a>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" id="cartToggle" aria-label="Open cart">
        🛒
        <span class="cart-count" id="cartCount" style="display:none;">0</span>
      </button>
    </div>
  </div>
</header>

<div class="overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h2>Your Cart</h2>
    <button class="cart-close" id="cartClose" aria-label="Close cart">&times;</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer" id="cartFooter">
    <div class="cart-subtotal-row">
      <span>Subtotal</span>
      <span id="cartSubtotal">$0.00</span>
    </div>
    <button class="btn btn-primary btn-block" id="checkoutBtn">Checkout</button>
    <p class="cart-note">Shipping &amp; tax calculated at checkout.</p>
  </div>
</aside>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg">Added to cart</span></div>
